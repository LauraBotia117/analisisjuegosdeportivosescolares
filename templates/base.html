<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Análisis de Datos de Juegos Deportivos Institucionales Escolares{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            Análisis de Datos de Juegos Deportivos Institucionales Escolares
        </a>

        <div>
            <a class="nav-link d-inline text-white" href="/">
                Inicio
            </a>

            <a class="nav-link d-inline text-white" href="{{ url_for('poblacional') }}">
                Poblacional
            </a>

            <a class="nav-link d-inline text-white" href="{{ url_for('territorial') }}">
                Territorial
            </a>

            <a class="nav-link d-inline text-white" href="{{ url_for('temporal') }}">
                Temporal
            </a>

            <a class="nav-link d-inline text-white" href="{{ url_for('multivariada') }}">
                Multivariada
            </a>
        </div>

    </div>
</nav>


<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
